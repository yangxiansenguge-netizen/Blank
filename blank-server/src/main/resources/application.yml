server:
  port: ${PORT:3000}

spring:
  profiles:
    include: secret
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:blank}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  mail:
    host: ${EMAIL_HOST:smtp.163.com}
    port: ${EMAIL_PORT:465}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${EMAIL_SECURE:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:blank_default_secret}
  expiration: 604800000

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  res-dir: ${RES_DIR:res}
  max-file-size: ${MAX_FILE_SIZE:10485760}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
  email:
    verify-expiry: ${EMAIL_VERIFY_EXPIRY:3600}
    verification-code-length: ${VERIFICATION_CODE_LENGTH:6}
    from: ${EMAIL_FROM:Blank <blank@example.com>}
  ai:
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    text-cost: 5
    image-cost: 10
  zpay:
    base-url: ${ZPAY_BASE_URL:https://zpayz.cn}
    pid: ${ZPAY_PID:}
    pkey: ${ZPAY_PKEY:}
    default-type: ${ZPAY_DEFAULT_TYPE:alipay}
    cid: ${ZPAY_CID:}
  cors:
    allowed-origins: ${CORS_ORIGIN:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.blank.app.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
